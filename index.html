<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioinformatics Team Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      box-shadow: 0 1px 3px rgba(31, 35, 40, 0.06);
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }
    #error-banner {
      display: none;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 6px;
      background: #ffebe9;
      border: 1px solid #ff8182;
      color: #cf222e;
      font-size: 0.9rem;
    }
    .fc-event {
      padding: 2px 5px;
      font-size: 0.82rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Team Leave Calendar</h1>
      <div class="legend">
        <span class="legend-item"><span class="swatch" style="background:#0969da;"></span>Annual</span>
        <span class="legend-item"><span class="swatch" style="background:#bf3989;"></span>Sick</span>
        <span class="legend-item"><span class="swatch" style="background:#1a7f37;"></span>Other</span>
      </div>
    </div>
    <div id="error-banner"></div>
    <div id="calendar"></div>
  </div>

  <script>
    const TYPE_COLORS = {
      annual: '#0969da',
      sick: '#bf3989',
      default: '#1a7f37'
    };

    function getColor(type) {
      if (!type) return TYPE_COLORS.default;
      const key = String(type).trim().toLowerCase();
      for (const [label, color] of Object.entries(TYPE_COLORS)) {
        if (key.includes(label)) return color;
      }
      return TYPE_COLORS.default;
    }

    function toIsoDate(val) {
      if (val instanceof Date) {
        return val.toISOString().slice(0, 10);
      }
      return String(val).trim().slice(0, 10);
    }

    function addOneDay(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const next = new Date(Date.UTC(y, m - 1, d + 1));
      return next.toISOString().slice(0, 10);
    }

    async function loadLeaveEvents() {
      const response = await fetch(`./leave.yml?t=${Date.now()}`);
      if (!response.ok) {
        throw new Error(`Could not load leave.yml (HTTP ${response.status})`);
      }
      const yamlText = await response.text();
      const entries = jsyaml.load(yamlText) || [];

      return entries.map((item) => {
        const start = toIsoDate(item.start);
        const end = addOneDay(toIsoDate(item.end || item.start));
        const type = item.type || 'Leave';
        return {
          title: `${item.name} (${type})`,
          start,
          end,
          allDay: true,
          backgroundColor: getColor(type),
          borderColor: getColor(type)
        };
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const calendarEl = document.getElementById('calendar');
      const errorEl = document.getElementById('error-banner');

      let events = [];
      try {
        events = await loadLeaveEvents();
      } catch (err) {
        errorEl.textContent = `Failed to load team leave data: ${err.message}`;
        errorEl.style.display = 'block';
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        firstDay: 1,
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,listMonth'
        },
        events
      });

      calendar.render();
    });
  </script>
</body>
</html>
