<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bioinformatics Team Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      box-shadow: 0 1px 3px rgba(31, 35, 40, 0.06);
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }
    #error-banner {
      display: none;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 6px;
      background: #ffebe9;
      border: 1px solid #ff8182;
      color: #cf222e;
      font-size: 0.9rem;
    }
    .fc-event {
      padding: 2px 5px;
      font-size: 0.82rem;
      border-radius: 4px;
      cursor: pointer;
    }
    /* Event details modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(31, 35, 40, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-width: 420px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(31, 35, 40, 0.2);
    }
    .modal h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    .modal-meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .modal-notes {
      font-size: 0.92rem;
      line-height: 1.45;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .btn-primary {
      background: #0969da;
      border-color: #0969da;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Team Leave &amp; Meetings</h1>
      <div class="legend">
        <span class="legend-item"><span class="swatch" style="background:#d97706;"></span>Meeting</span>
        <span class="legend-item"><span class="swatch" style="background:#0969da;"></span>Annual</span>
        <span class="legend-item"><span class="swatch" style="background:#bf3989;"></span>Sick</span>
        <span class="legend-item"><span class="swatch" style="background:#1a7f37;"></span>Other Leave</span>
      </div>
    </div>
    <div id="error-banner"></div>
    <div id="calendar"></div>
  </div>

  <div id="event-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <div id="modal-meta" class="modal-meta"></div>
      <div id="modal-notes" class="modal-notes"></div>
      <div class="modal-actions">
        <a id="modal-link" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">Join Meeting</a>
        <button id="modal-close" class="btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    const LEAVE_COLORS = {
      annual: '#0969da',
      sick: '#bf3989',
      default: '#1a7f37'
    };
    const MEETING_COLOR = '#d97706';

    const DAY_MAP = {
      sun: 0, sunday: 0,
      mon: 1, monday: 1,
      tue: 2, tues: 2, tuesday: 2,
      wed: 3, wednesday: 3,
      thu: 4, thur: 4, thurs: 4, thursday: 4,
      fri: 5, friday: 5,
      sat: 6, saturday: 6
    };
    const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function getLeaveColor(type) {
      if (!type) return LEAVE_COLORS.default;
      const key = String(type).trim().toLowerCase();
      for (const [label, color] of Object.entries(LEAVE_COLORS)) {
        if (key.includes(label)) return color;
      }
      return LEAVE_COLORS.default;
    }

    function toIsoDate(val) {
      if (val instanceof Date) {
        return val.toISOString().slice(0, 10);
      }
      return String(val).trim().slice(0, 10);
    }

    function addOneDay(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const next = new Date(Date.UTC(y, m - 1, d + 1));
      return next.toISOString().slice(0, 10);
    }

    function normalizeTime(val) {
      const raw = String(val).trim();
      const parts = raw.split(':');
      const hh = parts[0].padStart(2, '0');
      const mm = (parts[1] || '00').padStart(2, '0');
      const ss = (parts[2] || '00').padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function parseDaysOfWeek(item) {
      const raw = item.days ?? item.day;
      if (raw === undefined || raw === null) return null;
      const list = Array.isArray(raw) ? raw : [raw];
      const parsed = list
        .map((d) => {
          if (typeof d === 'number') return d;
          const key = String(d).trim().toLowerCase();
          return key in DAY_MAP ? DAY_MAP[key] : Number(key);
        })
        .filter((n) => Number.isInteger(n) && n >= 0 && n <= 6);
      return parsed.length ? parsed : null;
    }

    async function fetchYaml(path, optional = false) {
      const response = await fetch(`${path}?t=${Date.now()}`);
      if (!response.ok) {
        if (optional && response.status === 404) return [];
        throw new Error(`Could not load ${path} (HTTP ${response.status})`);
      }
      const text = await response.text();
      return jsyaml.load(text) || [];
    }

    async function loadAllEvents() {
      const [leaveEntries, meetingEntries] = await Promise.all([
        fetchYaml('./leave.yml', false),
        fetchYaml('./meetings.yml', true)
      ]);

      const leaveEvents = leaveEntries.map((item) => {
        const startDate = toIsoDate(item.start);
        const endDate = toIsoDate(item.end || item.start);
        const type = item.type || 'Leave';
        const color = getLeaveColor(type);

        return {
          title: `${item.name} (${type})`,
          start: startDate,
          end: addOneDay(endDate),
          allDay: true,
          backgroundColor: color,
          borderColor: color,
          extendedProps: {
            isRecurring: false,
            when: startDate === endDate ? startDate : `${startDate} to ${endDate}`,
            notes: item.notes || '',
            link: ''
          }
        };
      });

      const meetingEvents = meetingEntries.map((item, idx) => {
        const daysOfWeek = parseDaysOfWeek(item);
        const timeLabel = item.end
          ? `${String(item.start)} – ${String(item.end)}`
          : String(item.start);
      
        if (daysOfWeek) {
          const dayLabels = daysOfWeek.map((d) => DAY_NAMES[d]).join(', ');
          const startDate = item.start_date || item.startDate;
          const endDate = item.end_date || item.endDate;
      
          return {
            groupId: `recurring-meeting-${idx}`,
            title: item.title,
            daysOfWeek,
            startTime: normalizeTime(item.start),
            endTime: item.end ? normalizeTime(item.end) : undefined,
            startRecur: startDate ? toIsoDate(startDate) : undefined,
            endRecur: endDate ? addOneDay(toIsoDate(endDate)) : undefined,
            allDay: false,
            backgroundColor: MEETING_COLOR,
            borderColor: MEETING_COLOR,
            extendedProps: {
              isRecurring: true,
              scheduleLabel: `Every ${dayLabels}`,
              timeLabel,
              notes: item.notes || '',
              link: item.link || ''
            }
          };
        }
      
        const dateStr = toIsoDate(item.date);
        const startIso = `${dateStr}T${normalizeTime(item.start)}`;
        const endIso = item.end ? `${dateStr}T${normalizeTime(item.end)}` : undefined;
      
        return {
          title: item.title,
          start: startIso,
          end: endIso,
          allDay: false,
          backgroundColor: MEETING_COLOR,
          borderColor: MEETING_COLOR,
          extendedProps: {
            isRecurring: false,
            when: `${dateStr} · ${timeLabel}`,
            notes: item.notes || '',
            link: item.link || ''
          }
        };
      });

      return [...leaveEvents, ...meetingEvents];
    }

    function openModal(event) {
      const { isRecurring, scheduleLabel, timeLabel, when, notes, link } = event.extendedProps;
      const metaText = isRecurring
        ? `${event.startStr.slice(0, 10)} (${scheduleLabel}) · ${timeLabel}`
        : when;
      
      document.getElementById('modal-title').textContent = event.title;
      document.getElementById('modal-meta').textContent = metaText;

      const notesEl = document.getElementById('modal-notes');
      notesEl.textContent = notes;
      notesEl.style.display = notes ? 'block' : 'none';

      const linkEl = document.getElementById('modal-link');
      if (link && /^https?:\/\//i.test(link)) {
        linkEl.href = link;
        linkEl.style.display = 'inline-block';
      } else {
        linkEl.style.display = 'none';
      }

      document.getElementById('event-modal').classList.add('open');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const calendarEl = document.getElementById('calendar');
      const errorEl = document.getElementById('error-banner');
      const modalEl = document.getElementById('event-modal');

      document.getElementById('modal-close').addEventListener('click', () => {
        modalEl.classList.remove('open');
      });
      modalEl.addEventListener('click', (e) => {
        if (e.target === modalEl) modalEl.classList.remove('open');
      });

      let events = [];
      try {
        events = await loadAllEvents();
      } catch (err) {
        errorEl.textContent = `Failed to load calendar data: ${err.message}`;
        errorEl.style.display = 'block';
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        firstDay: 1,
        height: 'auto',
        eventTimeFormat: {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        },
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,listMonth'
        },
        eventClick: (info) => {
          info.jsEvent.preventDefault();
          openModal(info.event);
        },
        events
      });

      calendar.render();
    });
  </script>
</body>
</html>
